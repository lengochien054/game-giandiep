<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Gián Điệp - Người Chơi</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #eef2f7; text-align: center; }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; min-width: 300px; margin-top: 50px; }
        input { padding: 10px; width: 80%; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        .hidden { display: none; }
        .player-list { list-style-type: none; padding: 0; text-align: left; }
        .player-item { padding: 8px 12px; background: #f8f9fa; margin-bottom: 5px; border-radius: 4px; border-left: 4px solid #007bff; }
    </style>
</head>
<body>

    <div id="login-screen" class="box">
        <h2>Tham Gia Trò Chơi</h2>
        <input type="text" id="username" placeholder="Nhập biệt danh của bạn..." maxlength="20">
        <br>
        <button onclick="joinGame()">Vào Phòng</button>
    </div>

    <div id="lobby-screen" class="box hidden">
        <h2>Phòng Chờ Gián Điệp</h2>
        <p style="color: #666;">Xin chào, <strong id="my-name" style="color: #007bff;"></strong>!</p>
        <hr>
        <h3>Người chơi khác trong phòng (<span id="count">0</span>)</h3>
        <ul id="players" class="player-list">
            </ul>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        const loginScreen = document.getElementById('login-screen');
        const lobbyScreen = document.getElementById('lobby-screen');
        const myNameEl = document.getElementById('my-name');
        const playerListEl = document.getElementById('players');
        const countEl = document.getElementById('count');

        // Hàm xử lý khi nhấn nút "Vào Phòng"
        function joinGame() {
            const username = document.getElementById('username').value.trim();
            
            if (!username) {
                alert("Vui lòng nhập biệt danh trước khi vào phòng!");
                return;
            }

            // Gửi sự kiện lên Server báo danh tính người chơi tham gia
            socket.emit('joinGame', username);

            // Chuyển đổi giao diện màn hình
            myNameEl.innerText = username;
            loginScreen.classList.add('hidden');
            lobbyScreen.classList.remove('hidden');
        }

        // Lắng nghe sự kiện cập nhật danh sách người chơi từ server phát ra
        socket.on('updatePlayerList', (playerList) => {
            playerListEl.innerHTML = '';
            countEl.innerText = playerList.length;

            playerList.forEach(player => {
                const li = document.createElement('li');
                li.className = 'player-item';
                // Đánh dấu nếu là chính mình để dễ nhìn
                const isMe = player.id === socket.id ? " (Bạn)" : "";
                li.innerHTML = `<strong>${player.name}</strong>${isMe}`;
                playerListEl.appendChild(li);
            });
        });

        // QUAN TRỌNG: Lắng nghe sự kiện bị Quản trò xóa (Kicked)
        socket.on('youAreKicked', () => {
            alert('Bạn đã bị Quản trò xóa khỏi phòng game (Có thể do nhập sai thông tin)!');
            
            // Tải lại trang để đưa người chơi quay về màn hình đăng nhập ban đầu
            window.location.reload(); 
        });
    </script>
</body>
</html>
